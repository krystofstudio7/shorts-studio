name: Daily report

# Every day after the publish: what broke and needs fixing, how today's videos look (frames from
# the render), and how everything performed. Posted as a GitHub issue (yesterday's is closed),
# kept in reports/daily/<date>/.
on:
  workflow_run:
    workflows: ["Render videos"]
    types: [completed]
  schedule:
    # fallback if the publish run never started or never finished: report anyway
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    # only after the daily scheduled publish, not after preview renders of new episodes
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Skip if today's report already exists
        id: done
        run: |
          git pull -q origin main
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "reports/daily/$(date -u +%F)/report.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.done.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.done.outputs.skip != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements-upload.txt pyyaml
      - name: Download today's rendered videos
        if: steps.done.outputs.skip != 'true'
        # without them the report uses YouTube's own frames instead
        continue-on-error: true
        run: |
          id="${{ github.event.workflow_run.id }}"
          [ -n "$id" ] || id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow render.yml --event schedule --limit 1 \
                               --json databaseId,createdAt -q ".[] | select(.createdAt >= \"$(date -u +%F)\") | .databaseId")
          [ -n "$id" ] || exit 0
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" -q '.artifacts[] | select(.name | startswith("videos-")) | .name' | head -1)
          [ -n "$name" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$name" -D out
      - name: Build report
        if: steps.done.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN_WHATIF: ${{ secrets.YT_REFRESH_TOKEN_WHATIF }}
          YT_REFRESH_TOKEN_STOIC: ${{ secrets.YT_REFRESH_TOKEN_STOIC }}
          YT_REFRESH_TOKEN_MITES: ${{ secrets.YT_REFRESH_TOKEN_MITES }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
        run: python daily_report.py --videos out --repo-url "https://github.com/$GITHUB_REPOSITORY"
      - name: Commit report
        if: steps.done.outputs.skip != 'true'
        run: |
          # frames are only needed for a couple of weeks; the numbers (stats.json) and report.md stay
          for d in reports/daily/*/; do
            [ "$(basename "$d")" \< "$(date -u -d '-14 days' +%F)" ] && git rm -q --ignore-unmatch "$d"*.jpg || true
          done
          git config user.name "shorts-studio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily
          git diff --cached --quiet && exit 0
          git commit -m "Daily report $(date -u +%F)"
          git pull --rebase origin main && git push origin HEAD:main
      - name: Post as issue
        if: steps.done.outputs.skip != 'true'
        run: |
          day=$(date -u +%F)
          gh label create daily-report --color 0E8A16 --description "Automatic daily report" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label daily-report --state open --json number -q '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --reason completed
          done
          gh issue create -R "$GITHUB_REPOSITORY" --label daily-report --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "$(cat reports/daily/$day/title.txt)" --body-file "reports/daily/$day/issue.md"
