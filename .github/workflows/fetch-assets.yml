name: Fetch assets

# Runs on pushes to asset branches, so new image searches can be tried without touching main.
on:
  push:
    branches: ["assets", "assets-*"]
    paths: ["assets/queries.yaml", "tools/fetch_assets.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml pillow
      - run: python tools/fetch_assets.py assets/queries.yaml
      - name: Commit images
        run: |
          git config user.name "shorts-studio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "Fetch public-domain assets"
          git push origin HEAD:${GITHUB_REF_NAME}
