channel: mind-mites
id: brain-test-003
series: Brain Test
number: 3
title: "Brain Test #3: The machine question 🐛"
hook: The answer is NOT 100
description: |
  5 machines make 5 widgets in 5 minutes. How long would 100 machines take to make 100 widgets?
  Comment your FIRST answer, be honest.
sources:
  - "Frederick, S. (2005). Cognitive Reflection and Decision Making. Journal of Economic Perspectives, 19(4), 25-42."
lines:
  - text: Five machines make five widgets in five minutes.
    caption: 5 machines make 5 widgets in 5 minutes.
    scene:
      rows: [{l: 5 MACHINES, r: "5 MIN"}, {l: 100 MACHINES, r: "?", hl: true}]
      rows_shown: 1
      rows_y: 760
      mite: {x: 860, y: 1660, s: 0.55, mood: waiting}
  - text: How long would a hundred machines take to make a hundred widgets? Three seconds.
    caption: How long would 100 machines take to make 100 widgets?
    update: {rows_shown: 2, countdown: 3, countdown_y: 1620, mite: {x: 860, y: 1700, s: 0.45, mood: waiting}}
    pause: 3.1
  - text: A hundred minutes? That's what the pattern tells you. It's wrong.
    caption: 100 minutes? That's what the pattern tells you. It's wrong.
    scene:
      big: 100 MIN?
      big_y: 520
      rows: [{l: "100 MINUTES", r: "", mark: "no"}]
      rows_y: 800
      mite: {x: 540, y: 1650, s: 0.8, mood: shock}
  - text: Look closer. Each machine makes one widget in five minutes.
    update:
      rows: [{l: "100 MINUTES", r: "", mark: "no"}, {l: "1 MACHINE", r: "1 IN 5 MIN"}]
  - text: So a hundred machines working together make a hundred widgets in the same five minutes.
    update:
      rows: [{l: "100 MINUTES", r: "", mark: "no"}, {l: "1 MACHINE", r: "1 IN 5 MIN"}, {l: "100 MACHINES", r: "5 MIN", mark: ok}]
      mite: {x: 540, y: 1650, s: 0.8, mood: happy}
  - text: Five minutes. The repeating number tricks your brain into copying the pattern.
    caption: 5 minutes. The repeating number tricks your brain into copying the pattern.
    scene:
      big: 5 MINUTES.
      big_y: 620
      mite: {x: 540, y: 1650, s: 0.8, mood: smug}
  - text: When the numbers rhyme, slow down. That's exactly when your brain takes a shortcut.
    scene:
      bg: dark
      big: NUMBERS RHYME? SLOW DOWN.
      big_y: 640
      big_size: 110
      mite: {x: 540, y: 1660, s: 0.6, mood: happy}
  - text: Send this to a friend who said a hundred.
    caption: Send this to a friend who said 100.
    pause: 1.0
    scene:
      share: Send this to a friend who said 100
      share_y: 560
      mite: {x: 540, y: 1000, s: 1.3, mood: happy, pop: true}
      nocaptions: true
