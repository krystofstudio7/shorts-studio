channel: mind-mites
id: brain-test-004
series: Brain Test
number: 4
title: "Brain Test #4: Would you switch doors? 🐛"
hook: Thousands argued this answer was wrong
description: |
  The Monty Hall problem. Three doors, one prize, the host opens a losing door. Do you switch?
  Comment STAY or SWITCH before you watch.
sources:
  - "vos Savant, M. (1990). Ask Marilyn. Parade Magazine, 9 September 1990 and follow-ups."
  - "Selvin, S. (1975). A problem in probability. The American Statistician, 29(1), 67."
lines:
  - text: Three doors. Behind one is a car. Behind the other two, goats.
    scene:
      rows: [{l: DOOR 1, r: "YOUR PICK"}, {l: DOOR 2, r: "?"}, {l: DOOR 3, r: "?"}]
      rows_y: 700
      mite: {x: 860, y: 1660, s: 0.55, mood: waiting}
  - text: You pick door one. The host, who knows where the car is, opens door three. A goat.
    caption: You pick door 1. The host, who knows where the car is, opens door 3. A goat.
    update:
      rows: [{l: DOOR 1, r: "YOUR PICK"}, {l: DOOR 2, r: "?"}, {l: DOOR 3, r: "GOAT", mark: "no"}]
  - text: Do you stay, or switch to door two? Three seconds.
    caption: Stay, or switch to door 2?
    update: {countdown: 3, countdown_y: 1620, mite: {x: 860, y: 1700, s: 0.45, mood: waiting}}
    pause: 3.1
  - text: Most people say it doesn't matter. Fifty fifty. It's not.
    caption: Most people say it doesn't matter. 50/50. It's not.
    scene:
      big: 50 / 50?
      big_y: 520
      mite: {x: 540, y: 1650, s: 0.8, mood: shock}
  - text: Your first pick had a one in three chance. That never changes.
    caption: Your first pick had a 1 in 3 chance. That never changes.
    scene:
      rows: [{l: STAY, r: "1/3"}, {l: SWITCH, r: "2/3", mark: ok}]
      rows_shown: 1
      rows_y: 760
      mite: {x: 540, y: 1650, s: 0.8, mood: waiting}
  - text: The other two doors had two in three. The host just showed you which one to take.
    caption: The other two doors had 2 in 3. The host just showed you which one to take.
    update: {rows_shown: 2, mite: {x: 540, y: 1650, s: 0.8, mood: happy}}
  - text: When a magazine columnist explained this in 1990, thousands of readers wrote in to say she was wrong. She wasn't.
    scene:
      bg: dark
      big: SHE WAS RIGHT.
      big_y: 620
      mite: {x: 540, y: 1660, s: 0.6, mood: smug}
  - text: Always switch. Send this to a friend who would stay.
    pause: 1.0
    scene:
      share: Send this to a friend who would stay
      share_y: 560
      mite: {x: 540, y: 1000, s: 1.3, mood: happy, pop: true}
      nocaptions: true
