channel: mind-mites
id: brain-test-005
series: Brain Test
number: 5
title: "Brain Test #5: How many people for a shared birthday? 🐛"
hook: Guess the number. You'll guess high.
description: |
  How many people need to be in a room for a 50% chance that two share a birthday?
  Comment your FIRST guess.
sources:
  - "The birthday problem: with 23 people the probability of a shared birthday is about 50.7%. Feller, W. (1968). An Introduction to Probability Theory and Its Applications, Vol. 1."
lines:
  - text: How many people do you need in a room for a fifty percent chance that two share a birthday?
    caption: How many people for a 50% chance that two share a birthday?
    scene:
      big: "50% CHANCE"
      big_y: 760
      mite: {x: 860, y: 1660, s: 0.55, mood: waiting}
  - text: Make a guess. Three seconds.
    update: {countdown: 3, countdown_y: 1620, mite: {x: 860, y: 1700, s: 0.45, mood: waiting}}
    pause: 3.1
  - text: Most people guess around a hundred and eighty. Half of three sixty five.
    caption: Most people guess around 180. Half of 365.
    scene:
      rows: [{l: YOUR GUESS, r: "~183", mark: "no"}]
      rows_y: 760
      mite: {x: 540, y: 1650, s: 0.8, mood: shock}
  - text: The real answer is twenty three.
    caption: The real answer is 23.
    scene:
      stat: {from: 183, to: 23, label: PEOPLE, dur: 1.4}
      stat_y: 620
      mite: {x: 540, y: 1650, s: 0.8, mood: happy}
      stat_ding: true
  - text: Because you're not comparing one person to everyone. You're comparing every pair.
    scene:
      rows: [{l: 23 PEOPLE, r: "253 PAIRS", mark: ok}]
      rows_y: 760
      big: EVERY PAIR COUNTS.
      big_y: 480
      mite: {x: 540, y: 1650, s: 0.8, mood: happy}
  - text: Twenty three people make two hundred fifty three pairs. That's a lot of chances to match.
    caption: 23 people make 253 pairs. That's a lot of chances to match.
  - text: With seventy people, it's above ninety nine percent. Check it in your next class.
    caption: With 70 people, it's above 99%. Check it in your next class.
    scene:
      bg: dark
      stat: {to: 99.9, decimals: 1, unit: "%", label: "WITH 70 PEOPLE"}
      stat_y: 640
      mite: {x: 540, y: 1660, s: 0.6, mood: smug}
  - text: Send this to the friend who shares your birthday.
    pause: 1.0
    scene:
      share: Send this to the friend who shares your birthday
      share_y: 560
      mite: {x: 540, y: 1000, s: 1.3, mood: happy, pop: true}
      nocaptions: true
