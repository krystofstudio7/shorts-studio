channel: mind-mites
id: brain-test-007
series: Brain Test
number: 7
title: "Brain Test #7: Why the medium popcorn exists 🍿"
hook: The medium popcorn isn't for you
description: |
  Small, medium, large. One of these exists only to change your choice. Black Friday is coming, so learn this trick before the shops use it on you.
sources:
  - "Huber, J., Payne, J. W. & Puto, C. (1982). Adding asymmetrically dominated alternatives: Violations of regularity and the similarity hypothesis. Journal of Consumer Research, 9(1), 90-98."
affiliate: "Thinking, Fast and Slow (Amazon Associates link pending)"
lines:
  - text: Small popcorn, three dollars. Large popcorn, seven dollars. Which one do you buy?
    caption: "Small popcorn: $3. Large: $7. Which one do you buy?"
    scene:
      rows: [{l: SMALL, r: "$3"}, {l: LARGE, r: "$7"}]
      rows_y: 760
      mite: {x: 860, y: 1660, s: 0.55, mood: waiting}
  - text: Plenty of people take the small. Now add a medium for six fifty.
    caption: "Plenty of people take the small. Now add a medium: $6.50."
    scene:
      rows: [{l: SMALL, r: "$3"}, {l: MEDIUM, r: "$6.50", hl: true}, {l: LARGE, r: "$7"}]
      rows_y: 760
      mite: {x: 860, y: 1660, s: 0.55, mood: waiting}
  - text: Which one now? Three seconds.
    update: {countdown: 3, countdown_y: 1620, mite: {x: 860, y: 1700, s: 0.45, mood: waiting}}
    pause: 3.1
  - text: Suddenly the large looks like a steal. Only fifty cents more than the medium!
    caption: Suddenly the large looks like a steal. Only 50¢ more!
    scene:
      rows: [{l: MEDIUM, r: "$6.50", mark: "no"}, {l: LARGE, r: "$7", mark: ok}]
      rows_y: 760
      big: WHAT A DEAL?
      big_y: 480
      mite: {x: 540, y: 1650, s: 0.8, mood: shock}
  - text: Nobody is meant to buy the medium. It's a decoy. It exists to make the large look cheap.
    scene:
      big: THE DECOY.
      big_y: 620
      mite: {x: 540, y: 1650, s: 0.8, mood: smug}
  - text: Researchers showed this in 1982. Adding a worse option shifts people toward the one next to it.
    scene:
      bg: dark
      big: A WORSE OPTION CHANGES YOUR CHOICE.
      big_y: 640
      big_size: 100
      mite: {x: 540, y: 1660, s: 0.6, mood: sad}
  - text: Black Friday is full of medium popcorns. Cover the middle option and ask what you actually wanted.
    scene:
      big: COVER THE MIDDLE.
      big_y: 620
      mite: {x: 540, y: 1650, s: 0.8, mood: happy}
  - text: Send this to the friend who always buys the large.
    pause: 1.0
    scene:
      share: Send this to the friend who always buys the large
      share_y: 560
      mite: {x: 540, y: 1000, s: 1.3, mood: happy, pop: true}
      nocaptions: true
