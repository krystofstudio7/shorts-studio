channel: mind-mites
id: brain-test-008
series: Brain Test
number: 8
title: "Brain Test #8: Why time speeds up as you get older ⏳"
hook: Why did this year fly by?
description: |
  Summers felt endless when you were ten. Now a whole year flies past. Two ideas from time-perception research explain why.
sources:
  - "Janet, P. (1877). Une illusion d'optique interne. Revue Philosophique (the proportional theory of time perception)."
  - "Hammond, C. (2012). Time Warped: Unlocking the Mysteries of Time Perception. Canongate (the holiday paradox and memory-based judgments of time)."
affiliate: "Time Warped by Claudia Hammond (Amazon Associates link pending)"
lines:
  - text: When you're ten, how much of your life is one year? Three seconds.
    caption: When you're 10, how much of your life is one year?
    scene:
      big: AGE 10
      big_y: 760
      countdown: 3
      countdown_y: 1620
      mite: {x: 860, y: 1700, s: 0.45, mood: waiting}
    pause: 3.1
  - text: Ten percent. A huge chunk.
    caption: 10%. A huge chunk.
    scene:
      stat: {to: 10, unit: "%", label: "OF YOUR LIFE AT 10"}
      stat_y: 620
      mite: {x: 540, y: 1650, s: 0.8, mood: happy}
  - text: At fifty, one year is just two percent of everything you've lived.
    caption: At 50, one year is just 2% of everything you've lived.
    scene:
      stat: {from: 10, to: 2, unit: "%", label: "OF YOUR LIFE AT 50", dur: 1.4}
      stat_y: 620
      mite: {x: 540, y: 1650, s: 0.8, mood: sad}
  - text: That's one old idea. Each year is a smaller slice, so it feels shorter.
    scene:
      rows: [{l: AGE 10, r: "10%"}, {l: AGE 50, r: "2%", hl: true}]
      rows_y: 760
      mite: {x: 540, y: 1650, s: 0.8, mood: waiting}
  - text: Another idea is memory. New experiences make lots of memories, and lots of memories make time feel long.
    scene:
      bg: dark
      big: NEW = LONG
      big_y: 620
      mite: {x: 540, y: 1660, s: 0.6, mood: happy}
  - text: Kids live through endless firsts. Adults repeat the same weeks, and the brain files them as one.
    scene:
      bg: dark
      big: SAME WEEK = ONE MEMORY
      big_y: 620
      big_size: 104
      mite: {x: 540, y: 1660, s: 0.6, mood: sad}
  - text: So if you want a longer year, collect more firsts. A new route, a new place, a new skill.
    scene:
      big: COLLECT FIRSTS.
      big_y: 620
      mite: {x: 540, y: 1650, s: 0.8, mood: smug}
  - text: Send this to someone you want to do something new with.
    pause: 1.0
    scene:
      share: Send this to someone you want to do something new with
      share_y: 560
      mite: {x: 540, y: 1000, s: 1.3, mood: happy, pop: true}
      nocaptions: true
