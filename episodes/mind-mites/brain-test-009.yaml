channel: mind-mites
id: brain-test-009
series: Brain Test
number: 9
title: "Brain Test #9: The Linda problem 🐛"
hook: 85% of people get this wrong
description: |
  Linda is 31, outspoken and very bright. Which is more likely? One of the most famous mistakes in psychology.
  Comment A or B before you watch the answer.
sources:
  - "Tversky, A. & Kahneman, D. (1983). Extensional versus intuitive reasoning: The conjunction fallacy in probability judgment. Psychological Review, 90(4), 293-315."
affiliate: "Thinking, Fast and Slow (Amazon Associates link pending)"
lines:
  - text: Linda is thirty one, single, outspoken and very bright. In college, she cared deeply about justice and discrimination.
    caption: Linda is 31, single, outspoken and very bright. In college, she cared deeply about justice.
    scene:
      big: LINDA, 31
      big_y: 760
      mite: {x: 860, y: 1660, s: 0.55, mood: waiting}
  - text: Which is more likely? A, Linda is a bank teller. Or B, Linda is a bank teller and active in the feminist movement.
    caption: "A: Linda is a bank teller. B: a bank teller AND active in the feminist movement."
    scene:
      rows: [{l: "A", r: "BANK TELLER"}, {l: "B", r: "TELLER + FEMINIST"}]
      rows_y: 760
      mite: {x: 860, y: 1660, s: 0.55, mood: waiting}
  - text: A or B? Three seconds.
    update: {countdown: 3, countdown_y: 1620, mite: {x: 860, y: 1700, s: 0.45, mood: waiting}}
    pause: 3.1
  - text: In the famous study, most people picked B. It fits the story so well.
    scene:
      stat: {to: 85, unit: "%", label: "PICKED B"}
      stat_y: 620
      mite: {x: 540, y: 1650, s: 0.8, mood: shock}
  - text: But B can't be more likely than A. Every feminist bank teller is still a bank teller.
    scene:
      rows: [{l: "A", r: "BANK TELLER", mark: ok}, {l: "B", r: "TELLER + FEMINIST", mark: "no"}]
      rows_y: 760
      mite: {x: 540, y: 1650, s: 0.8, mood: happy}
  - text: Adding details makes a story feel truer, but it can only make it less likely.
    scene:
      bg: dark
      big: MORE DETAIL = LESS LIKELY
      big_y: 640
      big_size: 104
      mite: {x: 540, y: 1660, s: 0.6, mood: smug}
  - text: Remember Linda next time a story sounds a little too perfect.
    scene:
      big: TOO PERFECT? CHECK IT.
      big_y: 620
      mite: {x: 540, y: 1650, s: 0.8, mood: happy}
  - text: Send this to a friend who picked B.
    pause: 1.0
    scene:
      share: Send this to a friend who picked B
      share_y: 560
      mite: {x: 540, y: 1000, s: 1.3, mood: happy, pop: true}
      nocaptions: true
