channel: mind-mites
id: brain-test-010
series: Brain Test
number: 10
title: 'Brain Test #10: How fast you forget 🐛'
hook: You'll forget most of this video.
description: |
  In 1885 one man memorized nonsense syllables and measured how fast he forgot them. His curve still explains why cramming fails. Remember the 3 words at the start and test yourself at the end.
sources:
- 'Ebbinghaus, H. (1885). Über das Gedächtnis (Memory: A Contribution to Experimental Psychology).'
- 'Murre, J. M. J. & Dros, J. (2015). Replication and analysis of Ebbinghaus'' forgetting curve. PLoS ONE 10(7): e0120644.'
lines:
- text: Quick test. Remember these three words. Lamp. River. Orange.
  scene:
    rows:
    - l: '1'
      r: LAMP
    - l: '2'
      r: RIVER
    - l: '3'
      r: ORANGE
    rows_y: 760
    mite:
      x: 860
      y: 1660
      s: 0.55
      mood: waiting
- text: In 1885, Hermann Ebbinghaus memorized lists of nonsense syllables, then tested himself again and again.
  scene:
    tag: BERLIN · 1885
    big: DAX. BOK. YAT.
    big_y: 760
    mite:
      x: 860
      y: 1660
      s: 0.55
      mood: waiting
- text: Within an hour, about half was gone. After a day, he had lost most of it.
  scene:
    stat:
      to: 50
      unit: '%'
      label: GONE WITHIN AN HOUR
    stat_y: 620
    mite:
      x: 540
      y: 1650
      s: 0.8
      mood: shock
- text: Forgetting is fast at first and then slows down. That's the forgetting curve.
  scene:
    bg: dark
    big: FAST, THEN SLOW.
    big_y: 640
    mite:
      x: 540
      y: 1660
      s: 0.6
      mood: smug
- text: Scientists repeated his experiment in 2015 and got almost the same curve.
  scene:
    tag: REPLICATED · 2015
    big: STILL TRUE.
    big_y: 760
    mite:
      x: 540
      y: 1650
      s: 0.8
      mood: happy
- text: The fix is to review just before you forget. After a day, then a few days, then a week. Each review flattens the curve.
  scene:
    rows:
    - l: DAY 1
      r: REVIEW
      mark: ok
    - l: DAY 3
      r: REVIEW
      mark: ok
    - l: DAY 7
      r: REVIEW
      mark: ok
    rows_y: 700
    mite:
      x: 540
      y: 1650
      s: 0.8
      mood: happy
- text: Now, the three words from the start. Three seconds.
  update:
    countdown: 3
    countdown_y: 1620
    mite:
      x: 860
      y: 1700
      s: 0.45
      mood: waiting
  pause: 3.1
