title: 'Brain Test #13: Say the colour, not the word 🎨'
hook: Say the colour. Not the word.
description: |
  The Stroop test: your reading brain is so fast it gets in the way. Try it, then comment how many you got right.
sources:
- Stroop, J. R. (1935). Studies of interference in serial verbal reactions. Journal of Experimental Psychology, 18(6), 643-662.
