channel: mind-mites
id: brain-test-014
series: Brain Test
number: 14
title: 'Brain Test #14: Half the people missed a gorilla 🦍'
hook: Half the people missed a gorilla.
description: |
  People counted basketball passes. A person in a gorilla suit walked through the middle. Half never saw it.
sources:
- 'Simons, D. J. & Chabris, C. F. (1999). Gorillas in our midst: sustained inattentional blindness for dynamic events. Perception, 28(9), 1059-1074.'
lines:
- text: People watched a video of players passing a basketball. Their job was to count the passes.
  scene:
    big: COUNT THE PASSES.
    big_y: 760
    mite:
      x: 860
      y: 1660
      s: 0.55
      mood: waiting
- text: Midway through, someone in a gorilla suit walked into the middle, thumped their chest and walked off.
  scene:
    big: A GORILLA?
    big_y: 760
    mite:
      x: 860
      y: 1660
      s: 0.55
      mood: waiting
- text: How many people noticed the gorilla? Guess. Three seconds.
  update:
    countdown: 3
    countdown_y: 1620
    mite:
      x: 860
      y: 1700
      s: 0.45
      mood: waiting
  pause: 3.1
- text: In that version of the study, about half of them never saw it.
  scene:
    stat:
      to: 50
      unit: '%'
      label: MISSED THE GORILLA
    stat_y: 620
    mite:
      x: 540
      y: 1650
      s: 0.8
      mood: shock
- text: It's called inattentional blindness. When you focus hard on one thing, your brain filters out the rest. Even a gorilla.
  scene:
    bg: dark
    big: FOCUS HIDES THINGS.
    big_y: 640
    mite:
      x: 540
      y: 1660
      s: 0.6
      mood: smug
- text: It's why texting drivers miss pedestrians. They're looking, but not seeing.
  scene:
    big: LOOKING ≠ SEEING.
    big_y: 760
    mite:
      x: 540
      y: 1650
      s: 0.8
      mood: waiting
- text: So when you're sure you'd notice, remember the gorilla.
  scene:
    big: REMEMBER THE GORILLA.
    big_y: 760
    mite:
      x: 540
      y: 1650
      s: 0.8
      mood: happy
- text: Send this to someone who never notices anything.
  pause: 1.0
  scene:
    share: Send this to someone who never notices anything
    share_y: 560
    mite:
      x: 540
      y: 1000
      s: 1.3
      mood: happy
      pop: true
    nocaptions: true
