channel: mind-mites
id: brain-test-015
series: Brain Test
number: 15
title: 'Brain Test #15: Nobody noticed the embarrassing T-shirt 👕'
hook: Everyone's staring at you? Nope.
description: |
  Students wore an embarrassing T-shirt into a room. They guessed half the room noticed. The real number was much lower.
sources:
- Gilovich, T., Medvec, V. H. & Savitsky, K. (2000). The spotlight effect in social judgment. Journal of Personality and Social Psychology, 78(2), 211-222.
lines:
- text: Students were asked to put on an embarrassing T-shirt and walk into a room full of people.
  scene:
    big: EMBARRASSING SHIRT.
    big_y: 760
    mite:
      x: 860
      y: 1660
      s: 0.55
      mood: waiting
- text: Afterwards they guessed how many people noticed the shirt. They said about half.
  scene:
    stat:
      to: 50
      unit: '%'
      label: THEY GUESSED
    stat_y: 620
    mite:
      x: 860
      y: 1660
      s: 0.55
      mood: waiting
- text: What was the real number? Three seconds.
  update:
    countdown: 3
    countdown_y: 1620
    mite:
      x: 860
      y: 1700
      s: 0.45
      mood: waiting
  pause: 3.1
- text: Only about a quarter of the room noticed. Half as many as they feared.
  scene:
    rows:
    - l: GUESSED
      r: ~50%
      mark: 'no'
    - l: REALITY
      r: ~25%
      mark: ok
    rows_y: 760
    mite:
      x: 540
      y: 1650
      s: 0.8
      mood: shock
- text: It's called the spotlight effect. We feel like everyone is watching us. They're busy worrying about themselves.
  scene:
    bg: dark
    big: NO SPOTLIGHT.
    big_y: 640
    mite:
      x: 540
      y: 1660
      s: 0.6
      mood: smug
- text: That awkward thing you said yesterday? Most people have already forgotten it.
  scene:
    big: THEY FORGOT.
    big_y: 760
    mite:
      x: 540
      y: 1650
      s: 0.8
      mood: happy
- text: Send this to someone who overthinks everything.
  pause: 1.0
  scene:
    share: Send this to someone who overthinks everything
    share_y: 560
    mite:
      x: 540
      y: 1000
      s: 1.3
      mood: happy
      pop: true
    nocaptions: true
