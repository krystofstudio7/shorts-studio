channel: mind-mites
id: brain-test-017
series: Brain Test
number: 17
title: 'Brain Test #17: Same choice, different words 🐛'
hook: Same facts. Opposite choices.
description: |
  Doctors and students were given the same choice twice, worded differently. Most of them flipped their answer. Comment A or B.
sources:
- Tversky, A. & Kahneman, D. (1981). The framing of decisions and the psychology of choice. Science, 211(4481), 453-458.
lines:
- text: A disease threatens six hundred people. Plan A saves two hundred for sure.
  caption: A disease threatens 600 people. Plan A saves 200 for sure.
  scene:
    rows:
    - l: A
      r: 200 SAVED
    rows_y: 760
    mite:
      x: 860
      y: 1660
      s: 0.55
      mood: waiting
- text: Plan B has a one in three chance to save everyone, and a two in three chance to save no one. Pick one.
  caption: 'Plan B: 1/3 chance all 600 saved, 2/3 chance nobody saved. Pick one.'
  scene:
    rows:
    - l: A
      r: 200 SAVED
    - l: B
      r: '1/3: ALL SAVED'
    rows_y: 760
    mite:
      x: 860
      y: 1660
      s: 0.55
      mood: waiting
- text: Most people, seventy two percent, picked A.
  caption: 72% picked A.
  scene:
    stat:
      to: 72
      unit: '%'
      label: PICKED A
    stat_y: 620
    mite:
      x: 540
      y: 1650
      s: 0.8
      mood: happy
- text: Another group heard it like this. With A, four hundred people will die. With B, one in three chance nobody dies.
  caption: 'Another group: with A, 400 die. With B, 1/3 chance nobody dies.'
  scene:
    rows:
    - l: A
      r: 400 DIE
    - l: B
      r: '1/3: NOBODY DIES'
    rows_y: 760
    mite:
      x: 860
      y: 1660
      s: 0.55
      mood: waiting
- text: Now seventy eight percent picked B. Same plans, same numbers. Only the words changed.
  caption: Now 78% picked B. Same plans. Only the words changed.
  scene:
    stat:
      to: 78
      unit: '%'
      label: PICKED B
    stat_y: 620
    mite:
      x: 540
      y: 1650
      s: 0.8
      mood: shock
- text: It's called the framing effect. Saved sounds safe, so we play it safe. Die sounds like a loss, so we gamble.
  scene:
    bg: dark
    big: FRAMING.
    big_y: 640
    mite:
      x: 540
      y: 1660
      s: 0.6
      mood: smug
- text: Next time you decide, flip the wording and see if you still agree.
  scene:
    big: FLIP THE WORDS.
    big_y: 760
    mite:
      x: 540
      y: 1650
      s: 0.8
      mood: happy
- text: Send this to someone who'd pick B.
  pause: 1.0
