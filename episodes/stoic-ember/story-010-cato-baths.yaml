- text: Cato could have demanded punishment. Instead, he said he didn't remember being struck.
  scene:
    setting: black
    big: '"WHAT BLOW?"'
    big_y: 720
    embers: 1.0
- text: Seneca tells this story in his book On Anger. Better not to notice an insult, he says, than to forgive it.
