channel: stoic-ember
id: story-010-cato-baths
series: One Stoic Story
number: 10
title: A stranger hit him in public. His reply was perfect.
hook: A stranger struck him. He shrugged.
description: |
  Cato was struck by a stranger in the public baths. When the man came back to apologize, Cato's answer became one of Seneca's favourite examples. One Stoic Story, true and short.
sources:
- 'Seneca, On Anger (De Ira) 2.32: Cato, struck unknowingly in the baths, later said he did not remember being struck.'
lines:
- text: A stranger hit him in public. He didn't hit back.
