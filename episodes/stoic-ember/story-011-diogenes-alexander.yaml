channel: stoic-ember
id: story-011-diogenes-alexander
series: One Stoic Story
number: 11
title: The most powerful man alive offered him anything.
hook: Ask me for anything, said Alexander.
description: |
  Alexander the Great met a philosopher who lived in a barrel and owned almost nothing. The Stoics grew out of his school. One Stoic Story, true and short.
sources:
- Plutarch, Life of Alexander 14 (Diogenes asks Alexander to stand a little out of his sun).
- 'Diogenes Laërtius, Lives 6 and 7: Zeno, founder of Stoicism, studied with the Cynic Crates, a follower of Diogenes.'
