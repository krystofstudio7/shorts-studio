channel: stoic-ember
id: story-012-burned-letters
series: One Stoic Story
number: 12
title: He found the traitors' letters. He burned them unread.
hook: He could read every traitor's letter.
description: |
  When his general rebelled, Marcus Aurelius was handed the rebels' letters. What he did with them says everything about him. One Stoic Story, true and short.
sources:
- 'Cassius Dio, Roman History 72 (71).27-29: the revolt of Avidius Cassius in AD 175 and Marcus''s leniency; Marcus had the conspirators'' correspondence burned without reading it.'
