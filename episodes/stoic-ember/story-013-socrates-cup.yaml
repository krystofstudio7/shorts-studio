channel: stoic-ember
id: story-013-socrates-cup
series: One Stoic Story
number: 13
title: Sentenced to death, he comforted his friends.
hook: His friends cried. He didn't.
description: |
  Socrates spent his last day talking philosophy with his friends. The Stoics saw him as the model of how to live and how to die. One Stoic Story, true and short.
sources:
- Plato, Phaedo 116-118 (the death of Socrates, 399 BC).
- Epictetus, Discourses (Socrates as the model the Stoics return to again and again).
