channel: stoic-ember
id: story-014-musonius-canal
series: One Stoic Story
number: 14
title: Exiled to hard labour, he kept teaching.
hook: Nero sent him to dig. He taught.
description: |
  Musonius Rufus, the teacher of Epictetus, was sentenced to dig Nero's canal across Greece. A visitor found him there, still a philosopher. One Stoic Story, true and short.
sources:
- Philostratus, Life of Apollonius 5.19 (Musonius in chains, digging at the Isthmus of Corinth).
- Tacitus, Annals 15.71 (Musonius Rufus exiled by Nero, AD 65).
