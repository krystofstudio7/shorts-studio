      zoom:
      - 1.0
      - 1.12
- text: Every morning, the most powerful man in the world told himself something unusual. Marcus Aurelius wrote it on the first page of Book 2 of his private notes.
  scene:
    setting: room
    figures:
    - x: 380
      pose: writing
      h: 520
    fire_x: 700
    tag: MEDITATIONS 2.1
- text: Begin the morning by saying to thyself, I shall meet with the busy-body, the ungrateful, arrogant, deceitful, envious, unsocial.
  nocap: true
  pause: 0.4
  scene:
    setting: black
    quote:
      text: Begin the morning by saying to thyself, I shall meet with the busy-body, the ungrateful, arrogant, deceitful, envious, unsocial.
      source: Marcus Aurelius · Meditations 2.1 · trans. George Long
    quote_y: 760
    nocaptions: true
- text: Sounds cynical. It isn't. He goes on. They act that way because they don't know better. And none of them can truly harm him.
  scene:
    setting: black
    big: EXPECT IT. FORGIVE IT.
    big_y: 720
    embers: 1.0
- text: He wasn't expecting the worst to be bitter. He was preparing so he wouldn't be surprised.
  scene:
    photo:
      src: assets/stoic/marcus-equestrian-commons-1.jpg
      focus:
      - 0.5
      - 0.4
      zoom:
      - 1.0
      - 1.12
- text: Prepared people stay calm. Surprised people react.
  scene:
    setting: black
    big: PREPARED > SURPRISED.
    big_y: 720
- text: Try it tomorrow before you check your phone.
  scene:
