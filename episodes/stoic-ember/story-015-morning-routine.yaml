channel: stoic-ember
id: story-015-morning-routine
series: One Stoic Story
number: 15
title: The emperor's morning routine was 2 sentences.
hook: Every morning, he expected difficult people.
description: |
  Marcus Aurelius started Book 2 of his private notebook with a warning to himself about the day ahead. One Stoic Story, true and short.
sources:
- Marcus Aurelius, Meditations 2.1, trans. George Long (1862), public domain.
lines:
- text: Every morning, Rome's emperor expected the worst people.
  nocap: true
  pause: 0.4
  scene:
