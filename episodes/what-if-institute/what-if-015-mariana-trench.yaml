- text: Sunlight disappears after about two hundred meters. Below that it's dark, cold and silent.
  caption: 'Sunlight fades after ~200 m. Below: dark, cold, silent.'
  scene:
    bg: dark
    color:
    - 2
    - 6
    - 14
