channel: what-if-institute
id: what-if-015-mariana-trench
series: What If You
number: 15
title: What if you dove to the bottom of the ocean? 🌊
hook: Everest would fit. With room spare.
description: |
  The deepest point on Earth is deeper than Everest is tall. Here's what the pressure would do, and who has actually been there.
sources:
- 'NOAA Ocean Exploration: Challenger Deep, Mariana Trench, roughly 10,900 m deep; pressure over 1,000 times surface pressure. https://oceanexplorer.noaa.gov/'
- Mount Everest height 8,849 m (China-Nepal survey, 2020).
lines:
- text: What if you dove to the deepest point in the ocean?
  nocap: true
  pause: 0.4
  scene:
    bg: descent
