      x: 540
      y: 900
      s: 0.8
      pose: fall
- text: Challenger Deep in the Mariana Trench. Almost eleven kilometers down.
  caption: Challenger Deep, Mariana Trench. Almost 11 km down.
  scene:
    tag: CHALLENGER DEEP
    bg: descent
    colors:
    - - 10
      - 50
      - 100
    - - 2
      - 10
      - 30
