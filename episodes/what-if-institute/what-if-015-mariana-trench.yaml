      x: 540
      y: 980
      s: 0.7
      pose: float
    big: TOTAL DARKNESS.
    big_y: 520
- text: At the bottom, the water presses with more than a thousand times the air pressure you feel now.
  scene:
    bg: dark
    color:
    - 2
    - 6
    - 14
    stat:
      to: 1000
      unit: ×
      label: SURFACE PRESSURE
    stat_y: 520
    shake: true
- text: Your body couldn't survive it. But inside a thick metal sphere, people have made it. Fewer have been there than to space.
  scene:
    bg: dark
    color:
    - 2
    - 6
    - 14
    big: FEWER THAN ASTRONAUTS.
