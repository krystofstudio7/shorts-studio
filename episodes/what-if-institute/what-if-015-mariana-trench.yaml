      to: 10900
      unit: ' M'
      label: DEEP
    stat_y: 520
- text: Drop Mount Everest in there and its peak would still be two kilometers underwater.
  caption: Drop Everest in and its peak would still be 2 km underwater.
  scene:
    bg: descent
    colors:
    - - 8
      - 40
