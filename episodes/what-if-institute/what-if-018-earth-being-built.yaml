channel: what-if-institute
id: what-if-018-earth-being-built
series: What If You
number: 18
title: Watch Earth being built, from lava to today 🌍
hook: 4.5 billion years. Under a minute.
description: |
  You learned the timeline in school. Here it is, played back: molten rock, the giant impact that made the Moon, the first oceans, the first life, Snowball Earth, Pangaea, and the very last split second that is us.
sources:
- 'NASA Science, Earth: formed about 4.54 billion years ago. https://science.nasa.gov/earth/facts/'
- 'NASA Science, Moon formation: a Mars-sized body (Theia) hit the young Earth about 4.5 billion years ago and the debris formed the Moon. https://science.nasa.gov/moon/formation/'
- 'Wilde et al. 2001, Nature 409: 4.4-billion-year-old zircons point to liquid water at the surface. https://doi.org/10.1038/35051550'
- 'Allwood et al. 2006, Nature 441: 3.43-billion-year-old stromatolites, early microbial life. https://doi.org/10.1038/nature04764'
- 'Lyons, Reinhard and Planavsky 2014, Nature 506: the Great Oxidation Event about 2.4 billion years ago. https://doi.org/10.1038/nature13068'
- 'Hoffman et al. 2017, Science Advances 3: Snowball Earth glaciations about 717-635 million years ago. https://doi.org/10.1126/sciadv.1600983'
- 'USGS, This Dynamic Earth: Pangaea assembled about 335 million years ago and broke up starting about 175 million years ago. https://pubs.usgs.gov/gip/dynamic/historical.html'
- 'Hublin et al. 2017, Nature 546: Homo sapiens fossils about 300,000 years old (300,000 / 4.54 billion x 45 s = 0.003 s). https://doi.org/10.1038/nature22336'
